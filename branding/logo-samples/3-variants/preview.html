<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo 3 variants</title>
    <style>
      body {
        margin: 0;
        padding: 20px 16px;
        background: #f3f4f6;
        color: #111318;
        font:
          14px/1.5 'Segoe UI',
          system-ui,
          sans-serif;
      }
      ol {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        border: 1px solid #e2e4e9;
        border-radius: 12px;
        background: #ffffff;
      }
      .big {
        width: 100%;
        aspect-ratio: 1;
      }
      h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .sizes {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-radius: 8px;
      }
      .light {
        background: #ffffff;
        border: 1px solid #e2e4e9;
      }
      .dark {
        background: #070a12;
      }
    </style>
  </head>
  <body>
    <ol>
      <li>
        <img class="big" src="3a-open.svg" alt="" />
        <h2>3a. Open</h2>
        <div class="sizes light">
          <img src="3a-open.svg" width="28" height="28" alt="" />
          <img src="3a-open.svg" width="16" height="16" alt="" />
        </div>
        <div class="sizes dark">
          <img src="3a-open.svg" width="28" height="28" alt="" />
          <img src="3a-open.svg" width="16" height="16" alt="" />
        </div>
      </li>
      <li>
        <img class="big" src="3b-outline.svg" alt="" />
        <h2>3b. Outline</h2>
        <div class="sizes light">
          <img src="3b-outline.svg" width="28" height="28" alt="" />
          <img src="3b-outline.svg" width="16" height="16" alt="" />
        </div>
        <div class="sizes dark">
          <img src="3b-outline.svg" width="28" height="28" alt="" />
          <img src="3b-outline.svg" width="16" height="16" alt="" />
        </div>
      </li>
      <li>
        <img class="big" src="3c-stamp-in-braces.svg" alt="" />
        <h2>3c. Stamp in braces</h2>
        <div class="sizes light">
          <img src="3c-stamp-in-braces.svg" width="28" height="28" alt="" />
          <img src="3c-stamp-in-braces.svg" width="16" height="16" alt="" />
        </div>
        <div class="sizes dark">
          <img src="3c-stamp-in-braces.svg" width="28" height="28" alt="" />
          <img src="3c-stamp-in-braces.svg" width="16" height="16" alt="" />
        </div>
      </li>
      <li>
        <img class="big" src="3d-lines-in-braces.svg" alt="" />
        <h2>3d. Lines in braces</h2>
        <div class="sizes light">
          <img src="3d-lines-in-braces.svg" width="28" height="28" alt="" />
          <img src="3d-lines-in-braces.svg" width="16" height="16" alt="" />
        </div>
        <div class="sizes dark">
          <img src="3d-lines-in-braces.svg" width="28" height="28" alt="" />
          <img src="3d-lines-in-braces.svg" width="16" height="16" alt="" />
        </div>
      </li>
      <li>
        <img class="big" src="3e-braces-on-stamp.svg" alt="" />
        <h2>3e. Braces on a stamp</h2>
        <div class="sizes light">
          <img src="3e-braces-on-stamp.svg" width="28" height="28" alt="" />
          <img src="3e-braces-on-stamp.svg" width="16" height="16" alt="" />
        </div>
        <div class="sizes dark">
          <img src="3e-braces-on-stamp.svg" width="28" height="28" alt="" />
          <img src="3e-braces-on-stamp.svg" width="16" height="16" alt="" />
        </div>
      </li>
    </ol>
  </body>
</html>
