[package]
name = "codestamp-desktop"
version = "0.3.7"
description = "Codestamp, a lightweight desktop API client"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
publish = false
default-run = "codestamp-desktop"

[lib]
name = "codestamp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
reqwest = { version = "0.13.5", features = ["gzip", "brotli", "deflate", "multipart", "stream", "cookies", "socks"] }
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
url = "2.5.8"
thiserror = "2.0.21"
http = "1.5.0"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
chacha20poly1305 = "0.11.0"
keyring-core = "1.0.1"
rquickjs = "0.14.0"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1.54.1", features = ["net", "time", "sync", "macros", "rt", "rt-multi-thread", "fs", "process", "io-util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
tauri-plugin-dialog = "2"
sha2 = "0.11"
hmac = "0.13"
hkdf = "0.13"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
md-5 = "0.11"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "tls-aws-lc", "tls-native-roots"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
tonic-reflection = { version = "0.14", default-features = false }
tokio-stream = "0.1"
roxmltree = "0.21.2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.14.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
