syntax = "proto3";
package shop;

import "types.proto";
import "google/protobuf/timestamp.proto";

service Shop {
  rpc GetOrder(OrderRequest) returns (Order);
  rpc ListOrders(ListRequest) returns (stream Order);
  rpc AddItems(stream Item) returns (Summary);
  rpc Chat(stream Note) returns (stream Note);
}

message OrderRequest {
  string id = 1;
}

message Order {
  string id = 1;
  int64 total = 2;
  Status status = 3;
  repeated Item items = 4;
  string auth = 5;
  string trace = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListRequest {
  int32 count = 1;
}

message Summary {
  int32 count = 1;
  int32 quantity = 2;
}

message Note {
  string text = 1;
}
